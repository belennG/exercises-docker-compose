services:
  frontend:
    image: gattichika/example-frontend
  backend:
    image: gattichika/example-backend
    environment:
      - REQUEST_ORIGIN=http://localhost:8000
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DATABASE=mydb
    depends_on:
      - redis
      - db
    restart: unless-stopped
  redis:
    image: redis
  
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - ./database:/var/lib/postgresql

  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend