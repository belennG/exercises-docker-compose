services:
  frontend:
    image: gattichika/example-frontend
    ports:
      - "5001:5001"
  backend:
    image: gattichika/example-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DATABASE=mydb
    depends_on:
      - redis
      - db
    restart: unless-stopped
  redis:
    image: redis
  
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - ./database:/var/lib/postgresql